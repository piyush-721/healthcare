[project]
name = "healthos-backend"
version = "1.0.0"
requires-python = ">=3.12"
# Runtime dependencies. Vercel installs from here; requirements/base.txt mirrors this
# list for Docker/pip (kept in sync by tests/test_vercel.py).
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<4",
  "drf-spectacular>=0.28,<1",
  "django-filter>=24.0",
  "django-cors-headers>=4.4,<5",
  "dj-database-url>=2.2,<4",
  "psycopg[binary]>=3.2,<4",
  "celery>=5.4,<6",
  "redis>=5.0",
  "PyJWT>=2.9,<3",
  "gunicorn>=23.0",
  "vercel>=0.11,<1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

# --- Vercel -------------------------------------------------------------------
# The Django app runs as a Vercel Function; Celery tasks run as a private,
# queue-triggered function fed by Vercel Queues (see config/settings/vercel.py).
[tool.vercel]
entrypoint = "config.wsgi:application"

[[tool.vercel.subscribers]]
entrypoint = "config.celery:app"

[tool.vercel.scripts]
build = "python vercel_build.py"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --strict-markers --no-migrations --reuse-db"
filterwarnings = ["ignore::DeprecationWarning:celery.*"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "BLE", "C4", "SIM", "RUF"]
ignore = [
  "S101",   # assert is fine in tests
  "RUF012", # DRF class attributes are idiomatic mutable lists
  "DJ001",  # blank CharFields without null are intentional
  "SIM108",
  "RUF001", "RUF002", "RUF003",  # typographic characters in user-facing copy
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"config/settings/*" = ["F405", "F403"]
# Enum labels such as PASSWORD_RESET / header names are not secrets.
"apps/audit/models.py" = ["S105"]
"apps/accounts/models.py" = ["S105"]
"apps/sharing/views.py" = ["S105"]
