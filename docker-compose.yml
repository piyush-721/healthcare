# HealthOS local development stack.
#   docker compose up --build
# Frontend: http://localhost:3000   API: http://localhost:8000/api/v1/   Mail: http://localhost:8025
name: healthos

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-secret-key-change-me-0123456789}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
  DATABASE_URL: postgres://healthos:healthos@postgres:5432/healthos
  REDIS_URL: redis://redis:6379/0
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
  AUTH_COOKIE_SECURE: "false"
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-HealthOS <no-reply@healthos.local>}
  PRIVATE_STORAGE_ROOT: /data/private_storage

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: healthos
      POSTGRES_USER: healthos
      POSTGRES_PASSWORD: healthos
    ports: ["${POSTGRES_PORT:-5434}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthos -d healthos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP sink so verification/reset emails can be opened in a browser.
  mailpit:
    image: axllent/mailpit:latest
    ports: ["${MAILPIT_UI_PORT:-8025}:8025", "${MAILPIT_SMTP_PORT:-1025}:1025"]

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment: *backend-env
    ports: ["${BACKEND_PORT:-8000}:8000"]
    volumes:
      - ./backend:/app
      - private-storage:/data/private_storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Celery worker with embedded beat scheduler (run beat separately in production).
  worker:
    build: ./backend
    command: celery -A config worker --beat --schedule /tmp/celerybeat-schedule --loglevel=INFO --concurrency=2
    environment: *backend-env
    volumes:
      - ./backend:/app
      - private-storage:/data/private_storage
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      BACKEND_ORIGIN: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend: { condition: service_healthy }

volumes:
  postgres-data:
  private-storage:
