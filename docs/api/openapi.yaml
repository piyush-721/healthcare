components:
  schemas:
    AdminAuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        actor:
          type: string
          format: uuid
          nullable: true
        actor_email:
          type: string
          format: email
          readOnly: true
        subject_user:
          type: string
          format: uuid
          nullable: true
        subject_email:
          type: string
          format: email
          readOnly: true
        profile_id:
          type: string
          format: uuid
          nullable: true
        target_type:
          type: string
          maxLength: 60
        target_id:
          type: string
          maxLength: 64
        ip_address:
          type: string
