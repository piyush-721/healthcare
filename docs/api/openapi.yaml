          * `ADMIN` - Platform admin
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - DEACTIVATED
          - SUSPENDED
        description: |-
          * `ACTIVE` - Active
          * `DEACTIVATED` - Deactivated by user
          * `SUSPENDED` - Suspended by admin
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
