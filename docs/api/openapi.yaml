openapi: 3.0.3
info:
  title: HealthOS API
  version: 1.0.0
  description: HealthOS personal and family health organization API. HealthOS organizes
    information; it does not diagnose or recommend treatment.
paths:
  /api/v1/admin/audit-logs/:
    get:
      operationId: admin_audit_logs_list
      parameters:
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
      - in: query
        name: created_at__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: created_at__lte
        schema:
          type: string
          format: date-time
      - in: query
        name: event_type
        schema:
          type: string
          enum:
          - ACCOUNT_DEACTIVATED
          - ACCOUNT_REACTIVATED
          - ACCOUNT_SUSPENDED
          - CAREGIVER_ACCEPTED
          - CAREGIVER_INVITED
          - CAREGIVER_PERMISSIONS_CHANGED
          - CAREGIVER_REVOKED
          - DOCUMENT_ARCHIVED
          - DOCUMENT_QUARANTINED
          - DOCUMENT_UPLOADED
          - DOCUMENT_VIEWED
          - EMAIL_VERIFIED
          - LOGIN
          - LOGIN_FAILED
          - LOGOUT
          - LOGOUT_ALL
          - PASSWORD_CHANGED
          - PASSWORD_RESET
          - PASSWORD_RESET_REQUESTED
          - RECORD_CREATED
          - RECORD_DELETED
          - RECORD_UPDATED
          - REFRESH_TOKEN_REUSE
          - ROLE_CHANGED
          - SESSION_REVOKED
          - SHARED_RECORD_ACCESSED
          - SHARE_ACCESS_DENIED
          - SHARE_CREATED
          - SHARE_REVOKED
          - SIGNUP
        description: |-
          * `SIGNUP` - Signup
          * `LOGIN` - Login
          * `LOGIN_FAILED` - Login Failed
          * `LOGOUT` - Logout
          * `LOGOUT_ALL` - Logout All
          * `SESSION_REVOKED` - Session Revoked
          * `REFRESH_TOKEN_REUSE` - Refresh Token Reuse
          * `EMAIL_VERIFIED` - Email Verified
          * `PASSWORD_CHANGED` - Password Changed
          * `PASSWORD_RESET_REQUESTED` - Password Reset Requested
          * `PASSWORD_RESET` - Password Reset
          * `ACCOUNT_DEACTIVATED` - Account Deactivated
          * `ACCOUNT_REACTIVATED` - Account Reactivated
          * `ACCOUNT_SUSPENDED` - Account Suspended
          * `ROLE_CHANGED` - Role Changed
          * `RECORD_CREATED` - Record Created
          * `RECORD_UPDATED` - Record Updated
          * `RECORD_DELETED` - Record Deleted
          * `DOCUMENT_UPLOADED` - Document Uploaded
          * `DOCUMENT_VIEWED` - Document Viewed
          * `DOCUMENT_ARCHIVED` - Document Archived
          * `DOCUMENT_QUARANTINED` - Document Quarantined
          * `CAREGIVER_INVITED` - Caregiver Invited
          * `CAREGIVER_ACCEPTED` - Caregiver Accepted
          * `CAREGIVER_PERMISSIONS_CHANGED` - Caregiver Permissions Changed
          * `CAREGIVER_REVOKED` - Caregiver Revoked
          * `SHARE_CREATED` - Share Created
          * `SHARE_REVOKED` - Share Revoked
          * `SHARED_RECORD_ACCESSED` - Shared Record Accessed
          * `SHARE_ACCESS_DENIED` - Share Access Denied
      - in: query
        name: event_type__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: subject_user
        schema:
          type: string
          format: uuid
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminAuditLogList'
          description: ''
